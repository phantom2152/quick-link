<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23111'/><path d='M18 6L10 18h7l-3 8 12-14h-7l3-8z' fill='%23fafafa'/></svg>"
    />
    <title>Transload — All Links</title>
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="auth.js"></script>
    <link rel="stylesheet" href="/tailwind.css" />
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-mono min-h-screen p-6">
    <div class="max-w-3xl mx-auto">
      <!-- Header -->
      <div class="mb-8 flex items-center justify-between">
        <div>
          <a
            href="/"
            class="text-xs text-zinc-600 hover:text-zinc-400 transition-colors"
            >← back</a
          >
          <h1 class="text-xl font-medium tracking-tight mt-2">All Links</h1>
          <p class="mt-1 text-xs text-zinc-600">Every transload URL created</p>
        </div>
        <div class="flex items-center gap-2">
          <button
            id="logoutBtn"
            onclick="logout()"
            class="hidden px-3 py-2 border border-zinc-800 text-zinc-500 hover:text-zinc-300 hover:border-zinc-600 rounded text-xs transition-colors"
          >
            log out
          </button>
          <a
            href="/"
            class="px-3 py-2 bg-zinc-100 text-zinc-900 rounded text-xs font-medium hover:bg-white transition-colors"
          >
            + New
          </a>
        </div>
      </div>

      <!-- Loading -->
      <div id="loading" class="text-xs text-zinc-600">Loading...</div>

      <!-- Error -->
      <div id="error" class="text-xs text-red-400 hidden"></div>

      <!-- Empty -->
      <div id="empty" class="hidden">
        <p class="text-xs text-zinc-600">
          No links created yet.
          <a href="/" class="text-zinc-400 underline underline-offset-2"
            >Create one →</a
          >
        </p>
      </div>

      <!-- Table -->
      <div id="tableWrap" class="hidden">
        <div class="flex items-center justify-between mb-3 h-7">
          <div class="text-xs text-zinc-600" id="countLabel"></div>
          <div id="bulkBar" class="hidden items-center gap-2">
            <span id="selectedLabel" class="text-xs text-zinc-400"></span>
            <button
              id="clearBtn"
              class="text-[10px] text-zinc-500 hover:text-zinc-300 transition-colors px-2 py-1 border border-zinc-800 rounded hover:border-zinc-600"
            >
              clear
            </button>
            <button
              id="bulkDeleteBtn"
              class="text-[10px] text-red-400 hover:text-red-300 transition-colors px-2 py-1 border border-red-900 rounded hover:border-red-700"
            >
              delete selected
            </button>
          </div>
        </div>
        <div class="border border-zinc-800 rounded overflow-hidden">
          <table class="w-full text-xs">
            <thead>
              <tr class="border-b border-zinc-800 bg-zinc-900">
                <th class="pl-4 py-3 w-8">
                  <input
                    type="checkbox"
                    id="selectAll"
                    class="accent-zinc-300 cursor-pointer"
                    aria-label="Select all"
                  />
                </th>
                <th
                  class="text-left px-4 py-3 text-zinc-500 font-medium uppercase tracking-widest text-[10px]"
                >
                  Filename
                </th>
                <th
                  class="text-left px-4 py-3 text-zinc-500 font-medium uppercase tracking-widest text-[10px]"
                >
                  Original URL
                </th>
                <th
                  class="text-left px-4 py-3 text-zinc-500 font-medium uppercase tracking-widest text-[10px] hidden sm:table-cell"
                >
                  Size
                </th>
                <th
                  class="text-left px-4 py-3 text-zinc-500 font-medium uppercase tracking-widest text-[10px] hidden sm:table-cell"
                >
                  Created
                </th>
                <th class="px-4 py-3"></th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-zinc-900"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      function formatBytes(bytes) {
        if (!bytes || bytes === "") return "—";
        const b = parseInt(bytes);
        if (isNaN(b)) return "—";
        if (b < 1024) return b + " B";
        if (b < 1024 * 1024) return (b / 1024).toFixed(1) + " KB";
        if (b < 1024 * 1024 * 1024)
          return (b / (1024 * 1024)).toFixed(1) + " MB";
        return (b / (1024 * 1024 * 1024)).toFixed(2) + " GB";
      }

      function formatDate(ts) {
        if (!ts) return "—";
        const d = new Date(ts * 1000);
        return d.toLocaleDateString("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric",
        });
      }

      function truncate(str, max) {
        if (!str) return "—";
        return str.length > max ? str.slice(0, max) + "…" : str;
      }

      // Only allow http(s) links; anything else (javascript:, data:, ...) is not clickable
      function safeHttpUrl(u) {
        try {
          const parsed = new URL(u);
          return ["http:", "https:"].includes(parsed.protocol)
            ? parsed.href
            : null;
        } catch {
          return null;
        }
      }

      // Tiny DOM helper: text always goes through textContent, never innerHTML
      function el(tag, { cls, text, attrs } = {}) {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text !== undefined) node.textContent = text;
        if (attrs)
          for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
        return node;
      }

      const actionBtnCls =
        "text-[10px] text-zinc-500 hover:text-zinc-300 transition-colors px-2 py-1 border border-zinc-800 rounded hover:border-zinc-600";

      const selected = new Set();
      let total = 0;

      function refreshCount() {
        document.getElementById("countLabel").textContent =
          `${total} link${total !== 1 ? "s" : ""}`;
        if (total <= 0) {
          document.getElementById("tableWrap").classList.add("hidden");
          document.getElementById("empty").classList.remove("hidden");
        }
      }

      function updateSelectionUI() {
        const n = selected.size;
        const bar = document.getElementById("bulkBar");
        bar.classList.toggle("hidden", n === 0);
        bar.classList.toggle("flex", n > 0);
        document.getElementById("selectedLabel").textContent = `${n} selected`;

        const boxes = document.querySelectorAll(
          "#tableBody input[type=checkbox]",
        );
        const all = document.getElementById("selectAll");
        all.checked = boxes.length > 0 && n === boxes.length;
        all.indeterminate = n > 0 && n < boxes.length;
      }

      function setAll(checked) {
        document.querySelectorAll("#tableBody tr").forEach((tr) => {
          tr.querySelector("input[type=checkbox]").checked = checked;
          tr.classList.toggle("bg-zinc-900/60", checked);
          if (checked) selected.add(tr.dataset.id);
          else selected.delete(tr.dataset.id);
        });
        updateSelectionUI();
      }

      async function deleteIds(ids, triggerBtn) {
        if (!ids.length) return;
        if (
          !confirm(
            ids.length === 1
              ? "Delete this link?"
              : `Delete ${ids.length} links?`,
          )
        )
          return;

        const original = triggerBtn.textContent;
        triggerBtn.textContent = "...";
        triggerBtn.disabled = true;

        try {
          const res = await api("/api/urls/delete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ids }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "Failed to delete");

          const gone = new Set(ids);
          document.querySelectorAll("#tableBody tr").forEach((tr) => {
            if (gone.has(tr.dataset.id)) tr.remove();
          });
          ids.forEach((id) => selected.delete(id));
          total -= data.deleted ?? ids.length;
          refreshCount();
          updateSelectionUI();
        } catch (err) {
          const error = document.getElementById("error");
          error.textContent = err.message;
          error.classList.remove("hidden");
        } finally {
          triggerBtn.textContent = original;
          triggerBtn.disabled = false;
        }
      }

      document
        .getElementById("selectAll")
        .addEventListener("change", (e) => setAll(e.target.checked));
      document
        .getElementById("clearBtn")
        .addEventListener("click", () => setAll(false));
      document
        .getElementById("bulkDeleteBtn")
        .addEventListener("click", (e) =>
          deleteIds([...selected], e.currentTarget),
        );

      function buildRow(row) {
        const filename = row.filename || "download.bin";
        const downloadUrl = `${window.location.origin}/download/${encodeURIComponent(row.id)}/${encodeURIComponent(filename)}`;

        const tr = el("tr", {
          cls: "hover:bg-zinc-900/60 transition-colors group",
        });

        tr.dataset.id = row.id;

        const tdCheck = el("td", { cls: "pl-4 py-3 w-8" });
        const cb = el("input", {
          cls: "accent-zinc-300 cursor-pointer",
          attrs: { type: "checkbox", "aria-label": `Select ${filename}` },
        });
        cb.addEventListener("change", () => {
          if (cb.checked) selected.add(row.id);
          else selected.delete(row.id);
          tr.classList.toggle("bg-zinc-900/60", cb.checked);
          updateSelectionUI();
        });
        tdCheck.append(cb);

        // Filename
        const tdName = el("td", {
          cls: "px-4 py-3 text-zinc-300 max-w-[160px]",
        });
        tdName.append(
          el("span", {
            cls: "truncate block",
            text: truncate(filename, 28),
            attrs: { title: filename },
          }),
        );

        // Original URL
        const tdUrl = el("td", {
          cls: "px-4 py-3 text-zinc-600 max-w-[200px]",
        });
        const safeHref = safeHttpUrl(row.original_url);
        if (safeHref) {
          tdUrl.append(
            el("a", {
              cls: "truncate block hover:text-zinc-400 transition-colors",
              text: truncate(row.original_url, 40),
              attrs: {
                href: safeHref,
                target: "_blank",
                rel: "noopener noreferrer",
                title: row.original_url,
              },
            }),
          );
        } else {
          tdUrl.append(
            el("span", {
              cls: "truncate block",
              text: truncate(row.original_url, 40),
              attrs: { title: row.original_url || "" },
            }),
          );
        }

        // Size + date
        const tdSize = el("td", {
          cls: "px-4 py-3 text-zinc-600 hidden sm:table-cell whitespace-nowrap",
          text: formatBytes(row.content_length),
        });
        const tdDate = el("td", {
          cls: "px-4 py-3 text-zinc-600 hidden sm:table-cell whitespace-nowrap",
          text: formatDate(row.created_at),
        });

        // Actions (visible by default on mobile, hover-reveal on sm+)
        const tdActions = el("td", { cls: "px-4 py-3 text-right" });
        const actions = el("div", {
          cls: "flex gap-2 justify-end sm:opacity-0 sm:group-hover:opacity-100 transition-opacity",
        });

        const copyBtn = el("button", {
          cls: actionBtnCls,
          text: "copy",
          attrs: { "aria-label": "Copy download link" },
        });
        copyBtn.addEventListener("click", () => copyLink(downloadUrl, copyBtn));

        const dlLink = el("a", {
          cls: actionBtnCls,
          text: "↓",
          attrs: { href: downloadUrl, "aria-label": "Download file" },
        });

        const delBtn = el("button", {
          cls: "text-[10px] text-zinc-600 hover:text-red-400 transition-colors px-2 py-1 border border-zinc-800 rounded hover:border-red-900",
          text: "✕",
          attrs: { "aria-label": "Delete link" },
        });
        delBtn.addEventListener("click", () => deleteIds([row.id], delBtn));

        actions.append(copyBtn, dlLink, delBtn);
        tdActions.append(actions);

        tr.append(tdCheck, tdName, tdUrl, tdSize, tdDate, tdActions);
        return tr;
      }

      async function load() {
        const loading = document.getElementById("loading");
        const error = document.getElementById("error");
        const empty = document.getElementById("empty");
        const tableWrap = document.getElementById("tableWrap");

        try {
          const res = await api("/api/urls");
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Failed to load");
          document.getElementById("logoutBtn").classList.remove("hidden");

          loading.classList.add("hidden");

          if (!data.urls || data.urls.length === 0) {
            empty.classList.remove("hidden");
            return;
          }

          total = data.total;
          refreshCount();

          const tbody = document.getElementById("tableBody");
          data.urls.forEach((row) => tbody.appendChild(buildRow(row)));

          tableWrap.classList.remove("hidden");
        } catch (err) {
          loading.classList.add("hidden");
          error.textContent = err.message;
          error.classList.remove("hidden");
        }
      }

      function copyLink(url, btn) {
        navigator.clipboard.writeText(url).then(() => {
          const orig = btn.textContent;
          btn.textContent = "copied";
          btn.classList.add("text-emerald-500");
          setTimeout(() => {
            btn.textContent = orig;
            btn.classList.remove("text-emerald-500");
          }, 1500);
        });
      }

      load();
    </script>
  </body>
</html>
